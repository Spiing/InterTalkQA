<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Anything</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg:#120B24;
    --bg-soft:#1E1440;
    --bg-card:#241A4F;
    --pink:#FF3D81;
    --yellow:#FFD23F;
    --teal:#2FE6C8;
    --text:#F5F0FF;
    --text-dim:#B8AEDC;
    --line:rgba(245,240,255,0.14);
    --font-display:'Fredoka',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(ellipse at top left, #29184f 0%, var(--bg) 55%);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;}
  ::selection{background:var(--pink);color:white;}

  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal);
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 8px var(--teal);
  }
  .btn{
    font-weight:600;
    font-size:15px;
    padding:14px 22px;
    border-radius:14px;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{
    background:linear-gradient(135deg,var(--pink),#ff6b9d);
    color:white;
    box-shadow:0 10px 24px -8px rgba(255,61,129,0.6);
  }
  .btn-primary:disabled{opacity:.4;box-shadow:none;cursor:not-allowed;}
  .btn-ghost{
    background:var(--bg-card);
    color:var(--text);
    border:1px solid var(--line);
  }
  .btn-ghost:hover{border-color:var(--teal);}

  .landing{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:64px 24px 40px;
  }
  .landing h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(38px,7vw,64px);
    text-align:center;
    line-height:1.05;
    background:linear-gradient(135deg,var(--yellow),var(--pink) 60%,var(--teal));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .landing .sub{
    margin-top:14px;
    color:var(--text-dim);
    font-size:16px;
    text-align:center;
    max-width:480px;
  }
  .role-grid{
    margin-top:52px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    width:100%;
    max-width:920px;
  }
  @media(max-width:760px){.role-grid{grid-template-columns:1fr;}}
  .role-card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:28px 24px;
    text-align:left;
    display:flex;flex-direction:column;gap:14px;
    transition:transform .18s ease, border-color .18s ease;
    text-decoration:none;color:inherit;
  }
  .role-card:hover{transform:translateY(-4px);border-color:var(--teal);}
  .role-card .tag{
    width:40px;height:40px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
  }
  .role-card h3{font-family:var(--font-display);font-size:20px;font-weight:600;}
  .role-card p{color:var(--text-dim);font-size:14px;line-height:1.5;}

  .submit-wrap{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .submit-card{
    width:100%;max-width:460px;
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:36px 28px;
  }
  .submit-card h1{
    font-family:var(--font-display);
    font-size:28px;font-weight:600;
    margin-top:14px;
  }
  .submit-card .th{font-size:15px;color:var(--text-dim);margin-top:6px;}
  textarea{
    width:100%;
    margin-top:24px;
    background:var(--bg);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:16px;
    color:var(--text);
    font-family:var(--font-body);
    font-size:16px;
    resize:none;
    min-height:130px;
    outline:none;
    transition:border-color .15s ease;
  }
  textarea:focus{border-color:var(--pink);}
  .charcount{
    display:flex;justify-content:flex-end;
    font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
    margin-top:6px;
  }
  .submit-card .btn-primary{width:100%;margin-top:18px;font-size:16px;}
  .success{display:none;text-align:center;padding:20px 0;}
  .success .check{
    width:56px;height:56px;border-radius:50%;
    background:var(--teal);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;
    font-size:26px;color:var(--bg);
    animation:pop .35s ease;
  }
  @keyframes pop{from{transform:scale(0);}to{transform:scale(1);}}
  .success h2{font-family:var(--font-display);font-size:22px;margin-bottom:6px;}
  .success p{color:var(--text-dim);font-size:14px;}
  .anon-note{display:flex;align-items:center;gap:8px;margin-top:18px;color:var(--text-dim);font-size:12px;}

  .admin-wrap{min-height:100vh;padding:32px 24px 60px;max-width:760px;margin:0 auto;}
  .admin-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:8px;}
  .admin-head h1{font-family:var(--font-display);font-size:26px;}
  .admin-current{
    margin-top:22px;
    background:linear-gradient(135deg,var(--bg-card),#2a1c5c);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px;
  }
  .admin-current .lbl{font-family:var(--font-mono);font-size:11px;color:var(--yellow);letter-spacing:.1em;text-transform:uppercase;}
  .admin-current .qtext{margin-top:10px;font-size:18px;line-height:1.5;}
  .admin-current .empty{color:var(--text-dim);font-size:14px;margin-top:8px;}
  .admin-current .clear-btn{margin-top:14px;}
  .queue-head{margin-top:32px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
  .queue-head h2{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--text-dim);}
  .badge{background:var(--pink);color:white;font-family:var(--font-mono);font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;}
  .q-item{
    background:var(--bg-card);border:1px solid var(--line);border-radius:16px;
    padding:16px 18px;margin-bottom:12px;
    display:flex;gap:14px;align-items:flex-start;justify-content:space-between;
  }
  .q-item .qbody{flex:1;}
  .q-item .qtext{font-size:15px;line-height:1.5;}
  .q-item .meta{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:6px;}
  .q-actions{display:flex;flex-direction:column;gap:8px;flex-shrink:0;}
  .q-actions button{font-family:var(--font-mono);font-size:11px;font-weight:600;padding:8px 12px;border-radius:10px;letter-spacing:.03em;}
  .act-show{background:var(--teal);color:var(--bg);}
  .act-dismiss{background:transparent;color:var(--text-dim);border:1px solid var(--line);}
  .empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
  .empty-state .icon{font-size:34px;margin-bottom:10px;}

  .display-wrap{min-height:100vh;display:flex;padding:0;}
  .display-left{
    flex:0 0 38%;background:var(--bg-soft);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    padding:40px;position:relative;
    border-right:2px dashed rgba(245,240,255,0.18);
  }
  .display-left .ev-title{
    font-family:var(--font-display);font-weight:600;
    font-size:clamp(24px,2.6vw,34px);text-align:center;
    background:linear-gradient(135deg,var(--yellow),var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #qrbox{background:white;padding:18px;border-radius:20px;box-shadow:0 0 0 4px var(--bg), 0 0 40px -6px var(--pink);}
  .display-left .scan-label{font-family:var(--font-mono);font-size:14px;color:var(--teal);letter-spacing:.08em;text-transform:uppercase;}
  .display-right{flex:1;display:flex;align-items:center;justify-content:center;padding:60px;position:relative;overflow:hidden;}
  .display-right::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 40%, rgba(255,61,129,0.16), transparent 60%);
    pointer-events:none;
  }
  .stage-card{max-width:780px;text-align:center;position:relative;z-index:1;}
  .stage-card .lbl{font-family:var(--font-mono);font-size:15px;color:var(--yellow);letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:20px;}
  .stage-card .qtext{
    font-family:var(--font-display);font-weight:600;
    font-size:clamp(28px,4.2vw,54px);line-height:1.25;
    animation:glow 2.6s ease-in-out infinite;
  }
  @keyframes glow{0%,100%{text-shadow:0 0 24px rgba(255,61,129,0.15);}50%{text-shadow:0 0 40px rgba(47,230,200,0.28);}}
  .stage-card .waiting{color:var(--text-dim);font-family:var(--font-body);font-size:20px;}
  .pulse-dot{width:10px;height:10px;border-radius:50%;background:var(--teal);display:inline-block;box-shadow:0 0 10px var(--teal);animation:pulse 1.6s ease-in-out infinite;margin-right:8px;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .back-link{position:fixed;top:18px;left:18px;font-family:var(--font-mono);font-size:12px;color:var(--text-dim);text-decoration:none;display:flex;align-items:center;gap:6px;z-index:5;}
  .back-link:hover{color:var(--teal);}

  .setup-warning{
    position:fixed;inset:0;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;
  }
  .setup-warning .box{max-width:480px;background:var(--bg-card);border:1px solid var(--pink);border-radius:20px;padding:30px;}
  .setup-warning h2{font-family:var(--font-display);color:var(--pink);margin-bottom:12px;}
  .setup-warning p{color:var(--text-dim);font-size:14px;line-height:1.6;margin-bottom:8px;}
  .setup-warning code{background:var(--bg);padding:2px 6px;border-radius:6px;font-family:var(--font-mono);font-size:12px;}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* =========================================================
   1) PASTE YOUR FIREBASE CONFIG HERE
   Firebase console -> gear icon -> Project settings -> Your apps -> web app
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDdtofyPSWoGrw6K1dMS11UaZMEzvk16ko",
  authDomain: "qasess.firebaseapp.com",
  projectId: "qasess",
  storageBucket: "qasess.firebasestorage.app",
  messagingSenderId: "448614842280",
  appId: "1:448614842280:web:c898a2a1853985d44da79d"
};
/* ========================================================= */

const isConfigured = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('PASTE_');

let db = null;
if(isConfigured){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}

(function(){
  const params = new URLSearchParams(window.location.search);
  const role = params.get('role');
  const app = document.getElementById('app');

  if(!isConfigured){
    app.innerHTML = `
      <div class="setup-warning">
        <div class="box">
          <h2>⚠️ Firebase not connected yet</h2>
          <p>Open this file, find <code>firebaseConfig</code> near the top of the &lt;script&gt; tag, and paste in the config object from your Firebase project (Project settings → Your apps).</p>
          <p>Once that's filled in, reload this page.</p>
        </div>
      </div>
    `;
    return;
  }

  function baseUrl(role){
    const u = new URL(window.location.href);
    u.search = '';
    if(role) u.searchParams.set('role', role);
    return u.toString();
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  function timeAgo(ts){
    const s = Math.floor((Date.now()-ts)/1000);
    if(s<60) return s+'s ago';
    const m = Math.floor(s/60);
    if(m<60) return m+'m ago';
    const h = Math.floor(m/60);
    return h+'h ago';
  }

  // ================= LANDING =================
  function renderLanding(){
    app.innerHTML = `
      <div class="landing">
        <span class="eyebrow">Live Q&amp;A · one-time event</span>
        <h1 style="margin-top:18px;">Ping SudLhor</h1>
        <p class="sub th">ทำไมคนทำมันหล่ออย่างงี้ กล้ามก็ใหญ่</p>
        <p class="sub" style="margin-top:2px;">Pick a screen below. Share the <b>Guest</b> link as a QR code.</p>
        <div class="role-grid">
          <a class="role-card" href="${baseUrl('submit')}">
            <div class="tag" style="background:rgba(47,230,200,0.15);">📱</div>
            <h3>Guest — Ask</h3>
            <p>The form attendees see after scanning the QR code. Anonymous, one text box.</p>
          </a>
          <a class="role-card" href="${baseUrl('admin')}">
            <div class="tag" style="background:rgba(255,210,63,0.15);">🛠️</div>
            <h3>Admin — Review</h3>
            <p>Open this on your laptop. See every question first, pick what goes on screen.</p>
          </a>
          <a class="role-card" href="${baseUrl('display')}">
            <div class="tag" style="background:rgba(255,61,129,0.15);">🖥️</div>
            <h3>Projector — Display</h3>
            <p>Open this on the projector. Split screen: QR code + the question you picked.</p>
          </a>
        </div>
      </div>
    `;
  }

  // ================= SUBMIT =================
  function renderSubmit(){
    app.innerHTML = `
      <div class="submit-wrap">
        <div class="submit-card">
          <span class="eyebrow">Anonymous · no name needed</span>
          <h1>Got a question?</h1>
          <p class="th">พิมพ์คำถามของคุณ ไม่ต้องใส่ชื่อ ระบบไม่เก็บว่าใครส่ง</p>
          <div id="formZone">
            <textarea id="qInput" maxlength="240" placeholder="Type your question here…"></textarea>
            <div class="charcount"><span id="cc">0</span>/240</div>
            <button class="btn btn-primary" id="sendBtn">Send question</button>
            <div class="anon-note">🔒 <span>Fully anonymous — Ping SudLhor only sees the text.</span></div>
          </div>
          <div class="success" id="successZone">
            <div class="check">✓</div>
            <h2>Sent!</h2>
            <p class="th">ส่งคำถามแล้ว รอดูว่าจะถูกเลือกขึ้นจอไหม</p>
            <button class="btn btn-ghost" id="againBtn" style="margin-top:20px;">Ask another</button>
          </div>
        </div>
      </div>
    `;
    const qInput = document.getElementById('qInput');
    const cc = document.getElementById('cc');
    const sendBtn = document.getElementById('sendBtn');
    qInput.addEventListener('input', ()=>{ cc.textContent = qInput.value.length; });

    sendBtn.addEventListener('click', async ()=>{
      const text = qInput.value.trim();
      if(!text) return;
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending…';
      try{
        await db.collection('questions').add({
          text, time: Date.now(), status: 'pending'
        });
        document.getElementById('formZone').style.display = 'none';
        document.getElementById('successZone').style.display = 'block';
      }catch(e){
        alert('Could not send, check your connection and try again.');
      }
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send question';
    });

    document.getElementById('successZone').addEventListener('click', (e)=>{
      if(e.target.id === 'againBtn'){
        qInput.value=''; cc.textContent='0';
        document.getElementById('formZone').style.display = 'block';
        document.getElementById('successZone').style.display = 'none';
      }
    });
  }

  // ================= ADMIN =================
  function renderAdmin(){
    app.innerHTML = `
      <a class="back-link" href="${baseUrl()}">← home</a>
      <div class="admin-wrap">
        <div class="admin-head">
          <h1>🛠️ Admin</h1>
          <span class="eyebrow">live</span>
        </div>
        <p style="color:var(--text-dim);font-size:14px;">Pick a question below to push it to the projector.</p>

        <div class="admin-current">
          <span class="lbl">On screen now</span>
          <div id="currentBox"><p class="empty">Nothing selected yet — QR code is showing.</p></div>
        </div>

        <div class="queue-head">
          <h2>Incoming questions</h2>
          <span class="badge" id="countBadge">0</span>
        </div>
        <div id="queueList"></div>
      </div>
    `;

    db.collection('questions').where('status','==','pending').orderBy('time','asc')
      .onSnapshot(snap=>{
        const items = snap.docs.map(d=>({id:d.id, ...d.data()}));
        document.getElementById('countBadge').textContent = items.length;
        const queueList = document.getElementById('queueList');
        if(items.length===0){
          queueList.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div>No questions yet. Waiting for the crowd…</div></div>`;
        }else{
          queueList.innerHTML = items.map(q=>`
            <div class="q-item">
              <div class="qbody">
                <div class="qtext">${escapeHtml(q.text)}</div>
                <div class="meta">${timeAgo(q.time)}</div>
              </div>
              <div class="q-actions">
                <button class="act-show" data-show="${q.id}" data-text="${encodeURIComponent(q.text)}">SHOW</button>
                <button class="act-dismiss" data-dismiss="${q.id}">dismiss</button>
              </div>
            </div>
          `).join('');
        }
      }, err=>{ console.error(err); });

    db.collection('meta').doc('current').onSnapshot(doc=>{
      const currentBox = document.getElementById('currentBox');
      if(!currentBox) return;
      const cur = doc.data();
      if(cur && cur.text){
        currentBox.innerHTML = `<div class="qtext">${escapeHtml(cur.text)}</div>
          <button class="btn btn-ghost clear-btn" id="clearCurrent">Clear from screen</button>`;
      }else{
        currentBox.innerHTML = `<p class="empty">Nothing selected yet — QR code is showing.</p>`;
      }
    });

    app.addEventListener('click', async (e)=>{
      const showBtn = e.target.closest('[data-show]');
      const dismissBtn = e.target.closest('[data-dismiss]');
      const clearBtn = e.target.closest('#clearCurrent');
      if(showBtn){
        const id = showBtn.getAttribute('data-show');
        const text = decodeURIComponent(showBtn.getAttribute('data-text'));
        await db.collection('meta').doc('current').set({ text, time: Date.now() });
        await db.collection('questions').doc(id).update({ status: 'shown' });
      }
      if(dismissBtn){
        const id = dismissBtn.getAttribute('data-dismiss');
        await db.collection('questions').doc(id).update({ status: 'archived' });
      }
      if(clearBtn){
        await db.collection('meta').doc('current').set({ text: null, time: Date.now() });
      }
    });
  }

  // ================= DISPLAY =================
  function renderDisplay(){
    app.innerHTML = `
      <div class="display-wrap">
        <div class="display-left">
          <div class="ev-title">FSci Inter Talk 2026</div>
          <div id="qrbox"></div>
          <div class="scan-label">📷 Scan to ask</div>
        </div>
        <div class="display-right">
          <div class="stage-card" id="stageCard">
            <span class="lbl"><span class="pulse-dot"></span>Live question</span>
            <div class="waiting">Waiting for the first question…</div>
          </div>
        </div>
      </div>
    `;
    new QRCode(document.getElementById('qrbox'), {
      text: baseUrl('submit'),
      width: 220,
      height: 220,
      colorDark: '#120B24',
      colorLight: '#ffffff'
    });

    db.collection('meta').doc('current').onSnapshot(doc=>{
      const stageCard = document.getElementById('stageCard');
      if(!stageCard) return;
      const cur = doc.data();
      if(cur && cur.text){
        stageCard.innerHTML = `
          <span class="lbl"><span class="pulse-dot"></span>Live question</span>
          <div class="qtext">${escapeHtml(cur.text)}</div>
        `;
      }else{
        stageCard.innerHTML = `
          <span class="lbl"><span class="pulse-dot"></span>Live question</span>
          <div class="waiting">Waiting for the next question…</div>
        `;
      }
    });
  }

  // ================= ROUTER =================
  if(role === 'submit') renderSubmit();
  else if(role === 'admin') renderAdmin();
  else if(role === 'display') renderDisplay();
  else renderLanding();
})();
</script>
</body>
</html>
